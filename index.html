    var circles = [];
    var keys = Object.keys(keyData);

    // Draw a circle for a key at a point (random if none given) and play its sound.
    function trigger(key, at) {
        var data = keyData[key];
        if (!data) return;
        var point = at || (new Point(view.size.width, view.size.height) * Point.random());
        var circle = new Path.Circle(point, Math.min(500, view.size.width * 0.5));
        circle.fillColor = data.color;
        data.sound.play();
        circles.push(circle);
        hideHint();
    }

    function onKeyDown(event) {
        trigger(String(event.key).toLowerCase());
    }

    // Touch and mouse: tap anywhere to play a random key at that spot.
    function onMouseDown(event) {
        trigger(keys[Math.floor(Math.random() * keys.length)], event.point);
    }

    function onFrame(event) {
        // Walk backwards so removing an item never skips the next one.
        for (var i = circles.length - 1; i >= 0; i--) {
            circles[i].fillColor.hue += 1;
            circles[i].scale(.9);
            if (circles[i].area < 1) {
                circles[i].remove();
                circles.splice(i, 1);
            }
        }
    }

    var hintHidden = false;
    function hideHint() {
        if (hintHidden) return;
        hintHidden = true;
        var hint = document.getElementById('hint');
        if (hint) hint.className = 'hidden';
    }
    </script>

    <canvas id="myCanvas" resize></canvas>
    <p id="hint">Press any key from A to Z, or tap the screen.</p>
