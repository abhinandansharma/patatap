<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Patatap</title>
  <meta name="description" content="Press a key, get a sound and a shape. Twenty-six synthesised hits, canvas motion, a loop recorder you can share by link, MIDI and touch." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://abhinandansharma.github.io/patatap/" />
  <meta property="og:title" content="Patatap" />
  <meta property="og:description" content="Press a key, get a sound and a shape. Twenty-six synthesised hits, canvas motion, a loop recorder you can share by link, MIDI and touch." />
  <meta property="og:image" content="https://abhinandansharma.github.io/patatap/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:creator" content="@notjustadev" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0b'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23e0202a' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f1ede4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" /></noscript>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="ui">
    <header class="top">
      <div class="brand"><i></i>Patatap</div>
      <div class="top-right">
        <span class="status" id="status"></span>
        <button class="pill" id="theme" aria-label="Toggle theme">Paper</button>
        <button class="pill" id="perf" aria-label="Performance mode, hides the interface">Perform <kbd style="font-family:var(--pixel)">F</kbd></button>
      </div>
    </header>

    <div class="hint" id="hint">
      <div>
        <h1>Press <em>any key</em>.</h1>
        <p>A to Z each play a synthesised sound and draw a shape. Left hand is drums, right hand is melody. <kbd>Enter</kbd> records a two-bar loop, <kbd>Space</kbd> plays it, tap anywhere on a phone.</p>
      </div>
    </div>

    <footer class="bottom">
      <div class="transport">
        <button class="pill rec" id="rec" aria-pressed="false"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="currentColor"/></svg><span class="label">Record</span> <kbd style="font-family:var(--pixel)">↵</kbd></button>
        <button class="pill" id="play" aria-pressed="false"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z" fill="currentColor"/></svg><span class="label" id="play-label">Play</span> <kbd style="font-family:var(--pixel)">␣</kbd></button>
        <button class="pill" id="clear">Clear</button>
        <span class="pill bpm"><button id="bpm-down" aria-label="Slower">−</button><b id="bpm">110</b><button id="bpm-up" aria-label="Faster">+</button><span style="color:var(--fg-3)">bpm</span></span>
        <button class="pill" id="share">Copy loop link</button>
        <div class="steps" id="steps" aria-hidden="true"></div>
      </div>
      <div class="legend" id="legend" aria-hidden="true"></div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <a class="made-by" href="https://abhinandansharma.github.io/portfolio/" target="_blank" rel="noreferrer" aria-label="Made by Abhinandan Sharma. Opens the portfolio."><svg class="made-by-mark" viewBox="0 0 512 512" width="20" height="20" aria-hidden="true"><defs><clipPath id="mb-clip"><rect width="512" height="512" rx="112"/></clipPath></defs><rect width="512" height="512" rx="112" fill="#e0202a"/><g clip-path="url(#mb-clip)"><path d="M256 78 C156 78 100 154 100 254 L100 540 L412 540 L412 254 C412 154 356 78 256 78 Z" fill="#0b0b0b"/><path d="M404 206 Q470 178 518 132 Q492 224 410 252 Z" fill="#0b0b0b"/><path d="M406 232 Q468 240 512 292 Q462 262 408 250 Z" fill="#0b0b0b"/><path d="M118 232 Q256 196 394 232 L394 262 Q256 304 118 262 Z" fill="#f1ede4"/><path d="M152 248 L238 234 L242 270 L166 280 Z" fill="#0b0b0b"/><path d="M360 248 L274 234 L270 270 L346 280 Z" fill="#0b0b0b"/></g></svg><span>Made by <b>Abhinandan</b></span></a>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
